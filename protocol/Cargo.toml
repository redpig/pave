[package]
name = "pave-protocol"
version = "0.1.0"
description = "The pave protocol: epoch sequences, tickets, recipient policy and two-tier gossip"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pave-kernel = { path = "../kernel" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
ed25519-dalek = "2"
