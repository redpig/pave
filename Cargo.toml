[workspace]
resolver = "2"
members = ["kernel", "protocol", "board", "schemes/briolette"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/redpig/pave"

# Pairing-based crypto is very slow unoptimized; optimize dependencies even in
# dev and test builds.
[profile.dev.package."*"]
opt-level = 3
