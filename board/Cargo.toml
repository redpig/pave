[package]
name = "pave-board"
version = "0.1.0"
description = "A civic work board on pave, and pave-node: a wallet process driven by JSON lines"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pave-node"
path = "src/main.rs"

[dependencies]
pave-kernel = { path = "../kernel" }
pave-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
ciborium = "0.2"
hex = "0.4"
pave-scheme-briolette = { path = "../schemes/briolette" }
rand = "0.8"
chacha20poly1305 = "0.10"
# Attestation at enrollment: certificate chains from Android and Apple.
sha2 = "0.10"
der = "0.7"
x509-cert = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }

[dev-dependencies]
x509-cert = { version = "0.2", features = ["builder"] }
