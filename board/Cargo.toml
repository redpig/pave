[package]
name = "pave-board"
version = "0.1.0"
description = "A civic work board on pave, and pave-node: a wallet process driven by JSON lines"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pave-node"
path = "src/main.rs"

[dependencies]
pave-kernel = { path = "../kernel" }
pave-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
hex = "0.4"
pave-scheme-briolette = { path = "../schemes/briolette" }
