[package]
name = "pave-ramp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A pave ramp on Bitcoin: a Taproot pool co-signed by the town's auditors"

[dependencies]
pave-board = { path = "../board" }
pave-kernel = { path = "../kernel" }
pave-protocol = { path = "../protocol" }
bitcoin = { version = "0.32", features = ["rand-std"] }
serde = { version = "1", features = ["derive"] }
